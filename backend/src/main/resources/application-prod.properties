# ============================================
# CONFIGURACIÓN DE PRODUCCIÓN (RAILWAY)
# ============================================
# Este archivo se activa con: -Dspring.profiles.active=prod

# ============================================
# SERVIDOR
# ============================================
# Railway asigna el puerto dinámicamente via variable $PORT
server.port=${PORT:8080}

# ============================================
# BASE DE DATOS (SUPABASE)
# ============================================
# Las variables de entorno se configuran en Railway Dashboard
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# JPA/HIBERNATE
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# ============================================
# CORS
# ============================================
# Permitir múltiples orígenes separados por coma
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ============================================
# LOGGING
# ============================================
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.unlar.ecosistema=${LOGGING_LEVEL_COM_UNLAR_ECOSISTEMA:INFO}
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# ============================================
# SEGURIDAD
# ============================================
# Deshabilitar DevTools en producción
spring.devtools.restart.enabled=false
