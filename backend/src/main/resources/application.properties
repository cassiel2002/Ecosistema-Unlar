# ============================================
# CONFIGURACIÓN DEL SERVIDOR
# ============================================
# Puerto donde correrá la aplicación (por defecto 8080)
server.port=8080

# ============================================
# CONFIGURACIÓN DE LA BASE DE DATOS (SUPABASE)
# ============================================
# Usando Transaction Pooler (IPv4 compatible)
# Host: aws-1-us-west-2.pooler.supabase.com
# Port: 6543
# Database: postgres
# User: postgres.izameyyymxdlosrdllbb

# URL de conexión JDBC con Transaction Pooler
# prepareThreshold=0 desactiva prepared statements para evitar conflictos con el pooler
spring.datasource.url=jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0

# Credenciales
spring.datasource.username=postgres.izameyyymxdlosrdllbb
spring.datasource.password=enzocassielfacundo

# Driver de PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# CONFIGURACIÓN DE JPA/HIBERNATE
# ============================================
# Dialecto de PostgreSQL para Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Mostrar las queries SQL en la consola (útil para aprender)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Estrategia de generación de esquema
# - none: No hace nada (recomendado para producción)
# - validate: Solo valida que el esquema coincida
# - update: Actualiza el esquema si es necesario
# - create: Crea el esquema desde cero (CUIDADO: borra datos)
# - create-drop: Crea al iniciar y borra al cerrar
# Usando 'none' porque Supabase ya tiene las tablas creadas
spring.jpa.hibernate.ddl-auto=none

# ============================================
# CONFIGURACIÓN DE CORS
# ============================================
# Permitir peticiones desde el frontend (React en puerto 5173)
cors.allowed-origins=http://localhost:5173

# ============================================
# CONFIGURACIÓN DE LOGGING
# ============================================
# Nivel de logs (TRACE, DEBUG, INFO, WARN, ERROR)
logging.level.root=INFO
logging.level.com.unlar.ecosistema=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ============================================
# CONFIGURACIÓN DE DESARROLLO
# ============================================
# Habilitar DevTools para recarga automática
spring.devtools.restart.enabled=true
